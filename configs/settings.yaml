model:
  # Local 4-bit models. NOTE: on a 16GB GPU only dense models ≲ ~12B fit in
  # 4-bit (Qwen3.8-27B and GLM-4.7-Flash are too large to run locally here).
  #   Qwen/Qwen3-14B              best quality reasoning that fits (~7.5 GB in 4-bit)
  #   Qwen/Qwen2.5-1.5B-Instruct  small but reliable (~2 GB in 4-bit)
  #   Qwen/Qwen3-8B               better quality (~5 GB in 4-bit)
  # API models (no GPU needed): google/gemini-2.5-flash, openai/gpt-4o, hf-api/...
  default: "Qwen/Qwen3-14B"
  hf_cache_dir: "models"
  quantization: "4bit"   # "4bit" (bitsandbytes), "8bit" or "none" (fp16)
  # device_map: "auto" is the default. To force everything onto GPU set e.g.:
  #   device_map: null
  #   max_memory: "14GiB"   # also cap GPU memory (leave ~1GB for activations)
  device_map: "auto"
  max_memory: null

vllm:
  # Local vLLM server (OpenAI-compatible). Start it first, e.g.:
  #   vllm serve Qwen/Qwen3.8-27B --max-model-len 32768 --gpu-memory-utilization 0.9
  # then reference models as vllm/<model-id>.
  base_url: "http://localhost:8000/v1"
  api_key: "EMPTY"

ocr:
  # Unlimited-OCR: pdf → text + formulas (LaTeX).
  # engine "transformers" runs the model in-process (needs a dedicated env with
  # the pinned deps in requirements-ocr.txt); engine "vllm" talks to a served
  # unlimited-ocr endpoint (e.g. docker: vllm/vllm-openai:unlimited-ocr).
  engine: "transformers"
  model: "baidu/Unlimited-OCR"
  cache_dir: "models"
  dpi: 300
  image_size: 1024
  max_length: 32768
  no_repeat_ngram_size: 35
  ngram_window: 1024
  prompt_file: "configs/prompts/ocr.yaml"
  vllm:
    base_url: "http://localhost:8001/v1"
    api_key: "EMPTY"
    model: "Unlimited-OCR"

paths:
  papers_dir: "PAPERS"
  output_dir: "output"

evaluation:
  quality_threshold: 7
  max_paper_chars: 20000
  temperature: 0.01
  max_retries: 3

extraction:
  temperature: 0.01
  max_retries: 3

dataset:
  instruction: "Given the UAV task description and environment context below, generate the reward function as a standalone Python function."

rate_limits:
  google: 5       # Gemini free tier: 5 req/min
  openai: 60      # OpenAI tier 1: 60 req/min
  xai: 60         # xAI default
  hf-api: 30      # HF Inference API free tier
  vllm: 240       # local vLLM server (hosted, so effectively unlimited)
